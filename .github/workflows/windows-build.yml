name: Windows Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match VERSION=$version"
          }

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DVRFK_BUILD_CORE=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Stage prebuilt package
        shell: pwsh
        run: |
          $dist = "dist/VRFullKeyboard_Windows_x64"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "build/Release/VRFullKeyboardControl.exe" $dist
          Copy-Item "build/Release/VRFullKeyboard.exe" $dist
          Copy-Item "build/Release/VRFullKeyboardUpdater.exe" $dist
          Copy-Item "build/Release/openvr_api.dll" $dist
          Copy-Item "release_files/README.txt" $dist
          Copy-Item "VERSION" "$dist/VERSION.txt"
          Compress-Archive -Path "$dist/*" -DestinationPath "dist/VRFullKeyboard_Windows_x64.zip" -Force
          $h = (Get-FileHash -Algorithm SHA256 "dist/VRFullKeyboard_Windows_x64.zip").Hash.ToLower()
          Set-Content -Encoding ascii "dist/VRFullKeyboard_Windows_x64.sha256" ($h + "  VRFullKeyboard_Windows_x64.zip")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRFullKeyboard-Windows-x64
          path: |
            dist/VRFullKeyboard_Windows_x64.zip
            dist/VRFullKeyboard_Windows_x64.sha256

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "dist/VRFullKeyboard_Windows_x64.zip"
          $sha = "dist/VRFullKeyboard_Windows_x64.sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sha --clobber
          } else {
            gh release create $tag $zip $sha --title "VR Full Keyboard $tag" --generate-notes
          }
